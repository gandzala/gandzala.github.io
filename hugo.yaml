baseURL: https://gandzala.github.io/
title: Jozef's Tech Blog
theme: PaperMod
enableGitInfo: true

caches:
  images:
    dir: :cacheDir/images

params:
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowToc: true
  ShowPostNavLinks: true
  comments: true

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 1
    - name: Tags
      url: /tags/
      weight: 2

markup:
  highlight:
    style: nord
